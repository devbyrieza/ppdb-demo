version: '3.8'

services:
  # PostgreSQL Database for Local Development
  postgres_dev:
    image: postgres:15-alpine
    container_name: ppdb_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ppdb_user
      POSTGRES_PASSWORD: ppdb_password123
      POSTGRES_DB: ppdb_alimam_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ppdb_user -d ppdb_alimam_dev" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
    driver: local
