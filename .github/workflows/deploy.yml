name: Auto Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Trigger Coolify Deployment
      run: |
        if [ -z "${{ secrets.COOLIFY_WEBHOOK }}" ]; then
          echo "⚠️ COOLIFY_WEBHOOK secret is not set. Skipping Coolify trigger."
          echo "To auto-deploy, add it to: Settings -> Secrets and variables -> Actions"
        else
          echo "🚀 Triggering Coolify deployment..."
          curl -s --max-time 30 -X GET "${{ secrets.COOLIFY_WEBHOOK }}" || echo "⚠️ Coolify webhook timed out or failed, but push succeeded."
          echo "✅ Trigger sent."
        fi
          
    - name: Notify Deployment Status
      run: |
        echo "📊 Changes pushed to main. Coolify trigger sent."
        echo "🌐 Monitor progress at: https://pesantren-alimam.com"
