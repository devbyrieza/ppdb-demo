name: Auto Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Trigger Coolify Deployment
      run: |
        if [ -n "${{ secrets.COOLIFY_WEBHOOK }}" ] && [ -n "${{ secrets.COOLIFY_TOKEN }}" ]; then
          echo "🚀 Triggering Coolify deployment..."
          curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" --max-time 30 -X GET "${{ secrets.COOLIFY_WEBHOOK }}" -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" || echo "⚠️ Coolify webhook timed out or failed, but build succeeded."
        elif [ -n "${{ secrets.COOLIFY_WEBHOOK }}" ]; then
          echo "🚀 Triggering Coolify deployment without token (fallback)..."
          curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" --max-time 30 -X GET "${{ secrets.COOLIFY_WEBHOOK }}" || echo "⚠️ Coolify webhook timed out or failed, but build succeeded."
        else
          echo "⚠️ COOLIFY_WEBHOOK secret not found. To auto-deploy, add it to GitHub Secrets."
        fi
          
    - name: Notify Deployment Status
      run: |
        echo "📊 Changes pushed to main. Coolify trigger sent."
        echo "🌐 Monitor progress at: https://pesantren-alimam.com"
