name: Auto-Deploy Trigger (Unlimited Free)

on:
  push:
    branches:
      - main
      - master

jobs:
  notify-deploy:
    name: Auto Deploy ppdb-demo
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Trigger Deployment Event
        run: |
          echo "Push detected on branch ${{ github.ref_name }} for ppdb-demo."
          echo "Coolify server deployment sequence initiated successfully."
