<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanda Arah Toilet</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        @page {
            size: A4 landscape;
            margin: 0;
        }
        
        * {
            box-sizing: border-box;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #6e1c23; /* Maroon */
            background-image: 
                linear-gradient(45deg, rgba(181, 150, 85, 0.05) 25%, transparent 25%, transparent 75%, rgba(181, 150, 85, 0.05) 75%, rgba(181, 150, 85, 0.05)),
                linear-gradient(45deg, rgba(181, 150, 85, 0.05) 25%, transparent 25%, transparent 75%, rgba(181, 150, 85, 0.05) 75%, rgba(181, 150, 85, 0.05));
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 270mm;
            height: 190mm;
            border: 8px solid #b59655; /* Gold */
            border-radius: 40px;
            display: flex;
            flex-direction: row-reverse; /* Put arrow on the left */
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: linear-gradient(135deg, #7a1f27 0%, #52141a 100%);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.5);
            position: relative;
        }

        .icon-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        /* Toilet Icons */
        .toilet-icons {
            display: flex;
            gap: 40px;
        }

        .toilet-icons svg {
            width: 180px;
            height: 180px;
            fill: #ffffff;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.3));
        }

        .text-section {
            text-align: center;
        }

        .text-section h1 {
            font-size: 130px;
            font-weight: 900;
            margin: 0;
            letter-spacing: 15px;
            color: #ffffff;
            text-shadow: 0 10px 20px rgba(0,0,0,0.4);
            text-transform: uppercase;
        }

        .arrow-section {
            flex: 0.6;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .arrow {
            width: 250px;
            height: 250px;
            fill: #b59655; /* Gold */
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4));
        }

        .header-logo {
            position: absolute;
            top: 40px;
            right: 50px; /* moved to right for balance since arrow is left */
            font-size: 22px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.7);
            letter-spacing: 3px;
        }

        /* Utility classes for arrow direction */
        .arrow-right { transform: rotate(0deg); }
        .arrow-left { transform: rotate(180deg); }
        .arrow-up { transform: rotate(-90deg); }
        .arrow-down { transform: rotate(90deg); }

    </style>
</head>
<body>
    <div class="container">
        <!-- Branding text at the top right -->
        <div class="header-logo">PESANTREN AL IMAM AL ISLAMI</div>

        <div class="icon-section">
            <div class="toilet-icons">
                <!-- Man Icon -->
                <svg viewBox="0 0 24 24">
                    <path d="M10,2H14A2,2 0 0,1 16,4V10A2,2 0 0,1 14,12H13V22H11V12H10A2,2 0 0,1 8,10V4A2,2 0 0,1 10,2M12,4A2,2 0 0,0 10,6A2,2 0 0,0 12,8A2,2 0 0,0 14,6A2,2 0 0,0 12,4Z"/>
                </svg>
                <!-- Woman Icon -->
                <svg viewBox="0 0 24 24">
                    <path d="M12,2A2,2 0 0,1 14,4A2,2 0 0,1 12,6A2,2 0 0,1 10,4A2,2 0 0,1 12,2M15.5,22H8.5L10,12H8L12,7L16,12H14L15.5,22Z"/>
                </svg>
            </div>
            <div class="text-section">
                <h1>TOILET</h1>
            </div>
        </div>

        <div class="arrow-section">
            <!-- Arrow Icon -->
            <svg viewBox="0 0 24 24" class="arrow arrow-left">
                <path d="M4,11V13H16L10.5,18.5L11.92,19.92L19.84,12L11.92,4.08L10.5,5.5L16,11H4Z" />
            </svg>
        </div>
    </div>
</body>
</html>
